name: validate-skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # 3.9 pins the supported floor; 3.x tracks the newest release
    # ubuntu 26.04 ships no 3.9 build, so the floor stays on the 24.04 runner
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install Python tooling
        run: python3 -m pip install -r requirements-tooling.txt
      - name: Validate skills
        run: python3 scripts/validate-skills.py
      - name: Check generated references and instructions
        run: make generated-check
      - name: Run script regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Python format + comment-style check
        run: bash scripts/checks/check-python-style.sh --format-check

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root tooling
        run: npm ci
      - name: Install Python tooling
        run: python3 -m pip install -r requirements-tooling.txt
      - name: Run staged-hook regression
        run: python3 -m unittest discover -s tests -p 'test_pre_commit_hook.py'
      - name: Prettier + ESLint format check
        run: npm run format:check
      - name: Audit root dependencies
        run: make audit-root

  worker-broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/worker-broker/package-lock.json
      - name: Install worker broker dependencies
        run: npm --prefix tools/worker-broker ci
      - name: Validate worker broker
        run: npm --prefix tools/worker-broker run check
      - name: Audit worker broker dependencies
        run: make audit-broker
