name: validate-skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # 3.9 pins the supported floor; 3.x tracks the newest release
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Validate skills
        run: python3 scripts/validate-skills.py
      - name: Run script regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Python format + comment-style check
        run: bash scripts/checks/check-python-style.sh --format-check

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root tooling
        run: npm ci
      - name: Run staged-hook regression
        run: python3 -m unittest discover -s tests -p 'test_pre_commit_hook.py'
      - name: Prettier + ESLint format check
        run: npm run format:check

  worker-broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/worker-broker/package-lock.json
      - name: Install worker broker dependencies
        run: npm --prefix tools/worker-broker ci
      - name: Validate worker broker
        run: npm --prefix tools/worker-broker run check
      - name: Audit worker broker dependencies
        run: npm --prefix tools/worker-broker audit --audit-level=high
