# .github/dependabot.yml
# keep GitHub Actions and both npm dependency trees current
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /tools/worker-broker
    schedule:
      interval: weekly
